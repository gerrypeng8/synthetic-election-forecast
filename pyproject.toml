[project]
name = "synthetic-election-forecast"
version = "0.1.0"
description = "Reproducible election forecasts using synthetic survey responses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydataverse>=0.3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
